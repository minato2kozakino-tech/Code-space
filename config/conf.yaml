project:
  name: "Origon AI"
  version: "2.0-deep-conversational"

paths:
  model_dir: "models"
  gaton_model: "models/gaton/gaton-v2.pth" # Bundle model path
  conversational_data: "database/conversational_data.csv"
  intent_model: "models/intent/intent_classifier.pkl"
  retriever_data: "database/retriever_index.pkl"
  code_db_lua: "database/lua_data.json"
  code_db_python: "database/python_data.json"

intent_classifier:
  model_type: "LogisticRegression"
  tfidf_max_features: 2000
  labels: ["chat", "code"]

retriever:
  top_k: 3 # Number of similar sentences to fetch as context
  tfidf_max_features: 5000

brain: # RNN (GRU) Settings
  hidden_size: 256
  num_layers: 2
  embedding_dim: 128
  dropout: 0.2
  rnn_type: "GRU" # As recommended for efficiency

trainer:
  epochs: 200
  learning_rate: 0.001
  batch_size: 64
  n_gram: 10 # Context window for training
  gradient_clip_norm: 1.0

chat:
  max_len: 60
  temperature: 0.7
  top_p: 0.85
  repetition_penalty:
    base: 2.0 # Adjusted for RNN
    incremental: 0.5
  context_window: 5
